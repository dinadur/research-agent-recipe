# The vLLM engine serves the main lane while the flag file exists. Other units (worker, judge) Want= llm-main;
# this condition turns such a pull into a no-op instead of starting a second engine on the same card.
# Do NOT use Conflicts= between the old and new engine units: a Wants= pull of the old unit would then stop the
# new engine and the lane would silently fall back.
[Unit]
ConditionPathExists=!/etc/research-agent/main-vllm.active
