# Log-only groundedness check of delivered quality-first answers (needs product_research.groundedness_judge in the
# Hermes config). Writes $HERMES_HOME/logs/groundedness-shadow.jsonl; never changes or delays an answer.
# Off: delete this file, systemctl daemon-reload, restart hermes-gateway.
[Service]
Environment=HERMES_PRODUCT_GROUNDEDNESS_SHADOW=1
