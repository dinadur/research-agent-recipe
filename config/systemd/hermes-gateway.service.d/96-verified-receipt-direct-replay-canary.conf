# Telegram only: if a receipt-bound turn committed a verified answer but its delivery failed, resend those exact
# stored bytes once (no model call; one attempt per session, recorded by a marker file).
# The paths below are the defaults under the service user's HERMES_HOME; systemd does not expand "~".
[Service]
Environment=HERMES_VERIFIED_RECEIPT_DIRECT_REPLAY_CANARY=1
Environment=HERMES_RESEARCH_RECEIPT_ROOT=/var/lib/hermes/.hermes/research-receipts
Environment=HERMES_VERIFIED_RECEIPT_DIRECT_REPLAY_MARKER_ROOT=/var/lib/hermes/.hermes/verified-receipt-direct-replay-attempts
