# Run the gateway from a pinned, patched checkout. The preflight refuses to start unless HEAD is the pinned commit
# and the worktree is clean, so an unreviewed code change can never go live by accident.
# Every code deploy must update the pin in the preflight script, or the gateway will not start.
[Unit]
RequiresMountsFor=/opt/research-agent/hermes
[Service]
WorkingDirectory=/opt/research-agent/hermes
ExecStartPre=/opt/research-agent/bin/hermes-preflight
ExecStart=
ExecStart=/opt/research-agent/hermes/.venv/bin/hermes gateway run --replace --force
Environment="PATH=/opt/research-agent/hermes/.venv/bin:/usr/local/bin:/usr/bin:/bin"
Environment=HERMES_DISABLE_LAZY_INSTALLS=1
